<style>/* INVTI — brand: cream #F5F3EE · ink #15161B · royal blue #314EDE */
:root {
  --bg: #f5f3ee;
  --card: #fffefb;
  --ink: #15161b;
  --muted: #5d6070;
  --line: #e2dfd6;
  --blue: #314ede;
  --blue-soft: #e9ecfc;
  --radius: 14px;
  --font: "Outfit", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --body: "Noto Sans KR", "Outfit", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
a { color: var(--blue); }
img { max-width: 100%; display: block; }

/* Language: show only the active language's blocks */
html[data-lang="ko"] [data-l="en"],
html[data-lang="en"] [data-l="ko"] { display: none !important; }

.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }
.wrap.wide { max-width: 1040px; }

/* Header */
.site-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(245, 243, 238, 0.92);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.brand { display: inline-flex; align-items: center; }
.brand img { height: 26px; width: auto; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a {
  font-family: var(--font); font-weight: 600; font-size: 15px;
  color: var(--muted); text-decoration: none;
  padding: 8px 12px; border-radius: 999px;
}
.nav a:hover { color: var(--ink); background: rgba(0,0,0,.04); }
.nav a[aria-current="page"] { color: var(--ink); }

.lang-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px 0 11px;
  background: #fff; color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  font: 600 13px/1 var(--mono); letter-spacing: .04em;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.lang-pill:hover { border-color: #cfcbc0; }
.lang-pill svg { width: 16px; height: 16px; }

.menu-btn {
  display: none;
  width: 40px; height: 40px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  align-items: center; justify-content: center; cursor: pointer;
}
.menu-btn svg { width: 20px; height: 20px; }

@media (max-width: 720px) {
  .nav { display: none; }
  .lang-pill { margin-left: auto; }
  .menu-btn { display: inline-flex; }
}

/* Full-screen mobile menu */
.mobile-menu {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: none; flex-direction: column;
  padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
.mobile-menu.open { display: flex; }
.mm-top { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.mm-top img { height: 26px; width: auto; }
.mm-close {
  width: 44px; height: 44px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.mm-close svg { width: 20px; height: 20px; }
.segmented {
  display: flex; margin: 8px 0 20px;
  background: #ebe8e0; border-radius: 12px; padding: 4px;
}
.segmented button {
  flex: 1; height: 40px; border: 0; border-radius: 9px;
  background: transparent; color: var(--muted);
  font: 600 15px var(--font); cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mm-links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.mm-links li { border-bottom: 1px solid var(--line); }
.mm-links a {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 2px; text-decoration: none; color: var(--ink);
  font: 700 22px var(--font);
}
.mm-links a svg { width: 22px; height: 22px; color: var(--muted); }
body.menu-open { overflow: hidden; }

/* Home */
.hero { padding: 64px 0 40px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .12em; color: var(--blue); text-transform: uppercase; margin: 0 0 14px; }
.hero h1 { font-family: var(--font); font-weight: 800; font-size: clamp(32px, 6vw, 52px); line-height: 1.15; margin: 0 0 16px; letter-spacing: -.01em; }
.hero p.lead { color: var(--muted); font-size: 18px; max-width: 560px; margin: 0; }
.hero-mark { height: 56px; width: auto; margin-bottom: 28px; }
.rule { width: 72px; height: 4px; background: var(--blue); border-radius: 2px; margin: 24px 0; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 40px; }
.fact { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.fact b { display: block; font: 800 26px var(--font); }
.fact span { color: var(--muted); font-size: 14px; }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; } }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 48px; }
.card-link {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--card); border: 1.5px solid var(--ink); border-radius: var(--radius);
  padding: 22px; text-decoration: none; color: var(--ink);
  box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s;
}
.card-link:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
.card-link strong { display: block; font: 700 20px var(--font); }
.card-link small { color: var(--muted); font-size: 14px; }
.card-link svg { width: 22px; height: 22px; flex: none; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--blue-soft); border-radius: var(--radius);
  padding: 14px 16px; font-size: 14px; color: #2a2f55; margin-bottom: 56px;
}
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 3px; color: var(--blue); }

/* Policy pages */
.doc { padding-top: 48px; padding-bottom: 64px; }
.doc h1 { font-family: var(--font); font-weight: 800; font-size: clamp(30px, 5vw, 40px); line-height: 1.2; margin: 0 0 8px; }
.doc .meta { font: 500 13px var(--mono); color: var(--muted); margin: 0 0 28px; }
.doc .intro { font-size: 17px; margin: 0 0 28px; }
.toc {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 28px;
}
.toc p { margin: 0 0 6px; font: 600 12px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 28px; font-size: 15px; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--blue); text-decoration: underline; }
@media (max-width: 560px) { .toc ol { columns: 1; } }

.doc section {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px 22px 8px; margin-bottom: 12px; scroll-margin-top: 80px;
}
.doc h2 { font-family: var(--font); font-weight: 700; font-size: 19px; margin: 0 0 10px; }
.doc section p, .doc section li { color: #33363f; font-size: 15.5px; }
.doc section p { margin: 0 0 14px; }
.doc section ul { margin: 0 0 14px; padding-left: 20px; }
.doc section li { margin-bottom: 6px; }
.doc table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 14.5px; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--line); }
.doc th { font-weight: 700; width: 34%; }

/* 404 */
.notfound { padding-top: 96px; padding-bottom: 96px; text-align: center; }
.notfound .code { font: 800 88px/1 var(--font); color: var(--blue); margin: 0 0 12px; }
.notfound h1 { font: 700 26px var(--font); margin: 0 0 10px; }
.notfound p { color: var(--muted); margin: 0 0 28px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: #fff; text-decoration: none;
  font: 600 16px var(--font); padding: 13px 22px; border-radius: 999px;
}
.btn svg { width: 18px; height: 18px; }

/* Footer */
.site-footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 14px; color: var(--muted); }
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center; }
.site-footer nav { display: flex; gap: 18px; }
.site-footer a { color: var(--muted); text-decoration: none; }
.site-footer a:hover { color: var(--ink); }
</style>
</head>

<script>// INVTI site: language switch (KO/EN) + full-screen mobile menu
(function () {
  var KEY = "invti-lang";
  var root = document.documentElement;

  function setLang(lang, save) {
    root.setAttribute("data-lang", lang);
    root.setAttribute("lang", lang);
    var title = root.getAttribute("data-title-" + lang);
    if (title) document.title = title;
    document.querySelectorAll(".lang-code").forEach(function (el) {
      el.textContent = lang.toUpperCase();
    });
    document.querySelectorAll("[data-set-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-set-lang") === lang));
    });
    if (save) {
      try { localStorage.setItem(KEY, lang); } catch (e) {}
    }
  }

  setLang(root.getAttribute("data-lang") || "ko", false);

  document.querySelectorAll(".lang-pill").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setLang(root.getAttribute("data-lang") === "ko" ? "en" : "ko", true);
    });
  });
  document.querySelectorAll("[data-set-lang]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setLang(btn.getAttribute("data-set-lang"), true);
    });
  });

  var menu = document.getElementById("mobile-menu");
  var openBtn = document.querySelector(".menu-btn");
  if (menu && openBtn) {
    var closeBtn = menu.querySelector(".mm-close");
    function open() {
      menu.classList.add("open");
      document.body.classList.add("menu-open");
      openBtn.setAttribute("aria-expanded", "true");
      closeBtn.focus();
    }
    function close() {
      menu.classList.remove("open");
      document.body.classList.remove("menu-open");
      openBtn.setAttribute("aria-expanded", "false");
      openBtn.focus();
    }
    openBtn.addEventListener("click", open);
    closeBtn.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && menu.classList.contains("open")) close();
    });
  }
})();
</script>
